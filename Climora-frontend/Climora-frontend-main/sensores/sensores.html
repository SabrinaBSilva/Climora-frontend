<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../shared/img/favicon.png" />
  <title>Sensores IoT · CLIMORA</title>
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
  <link rel="stylesheet" href="../shared/css/components.css" />
  <link rel="stylesheet" href="sensores.css" />
  <script src="../shared/js/theme.js"></script>
</head>
<body data-page="sensores">
  <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand__logo"><img src="../shared/img/logo-climora.png" alt="Logo CLIMORA" /></div>
        <div>
          <div class="brand__name">CLIMORA</div>
          <div class="brand__sub">Monitoramento Climático</div>
        </div>
      </div>

      <nav class="sidebar__nav">
        <a class="nav__link" href="../dashboard/dashboard.html" data-page="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a class="nav__link active" href="../sensores/sensores.html" data-page="sensores">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
          Sensores IoT
        </a>
        <a class="nav__link" href="../previsoes/previsoes.html" data-page="previsoes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Previsões
        </a>
        <a class="nav__link" href="../alertas/alertas.html" data-page="alertas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alertas
        </a>
        <a class="nav__link" href="../relatorios/relatorios.html" data-page="relatorios">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Relatórios
        </a>
        <a class="nav__link" href="../admin/admin.html" data-page="admin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Administração
        </a>
      </nav>

      <div class="sidebar__user">
        <div class="user__avatar" id="user-iniciais">--</div>
        <div class="user__info">
          <div class="user__name" id="user-nome">Usuário</div>
          <div class="user__role" id="user-perfil">Perfil</div>
        </div>
        <button class="user__logout" id="btn-sair" title="Sair">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="page">
        <header class="page__header">
          <div>
            <h1 class="page__title">Sensores IoT</h1>
            <p class="page__subtitle" id="status-sensores">Carregando sensores…</p>
          </div>
          <div class="seg" id="seg-periodo" role="group" aria-label="Período do histórico">
            <button type="button" class="seg__btn active" data-p="all">Todo histórico</button>
            <button type="button" class="seg__btn" data-p="7">7 dias</button>
            <button type="button" class="seg__btn" data-p="30">30 dias</button>
          </div>
        </header>

        <section class="sensors-layout">
          <div class="stack stack--sm" id="lista-sensores"></div>

          <div class="stack">
            <div class="card">
              <h2 class="card__title card__title--mb" id="titulo-historico">Histórico</h2>
              <p class="card__subtitle" id="status-historico">Carregando histórico do ThingSpeak…</p>
              <div class="chart-box chart-box--lg"><canvas id="grafico-historico"></canvas></div>
            </div>
            <div class="grid grid--3" id="metricas-sensor"></div>
            <div class="card" id="bloco-temp"></div>
            <div class="card" id="bloco-umi"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="../shared/js/layout.js"></script>
  <script src="../shared/js/charts-theme.js"></script>
  <script src="sensores.js"></script>
</body>
</html>
